{%- if site.supabase.url and site.supabase.url != '' and site.supabase.anon_key and site.supabase.anon_key != '' -%}
<li class="main-nav__item main-nav__item--auth">
  <div class="user-auth" data-user-auth>
    <div class="user-auth__identity" data-user-auth-identity>
      <span class="user-auth__avatar user-auth__avatar--guest" data-user-auth-guest aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
        </svg>
      </span>
      <img
        class="user-auth__avatar user-auth__avatar--photo"
        data-user-auth-photo
        alt=""
        width="36"
        height="36"
        decoding="async"
        hidden
      >
    </div>
    <button
      type="button"
      class="user-auth__toggle"
      data-user-auth-toggle
      aria-expanded="false"
      aria-controls="user-auth-menu"
      aria-haspopup="menu"
      aria-label="Account menu"
    >
      <span class="visuallyhidden">Account menu</span>
    </button>
    <div class="user-auth__dropdown" id="user-auth-menu" data-user-auth-dropdown hidden role="menu">
      <p class="user-auth__email" data-user-auth-email hidden></p>
      <div class="user-auth__sign-in" data-user-auth-sign-in-panel>
        <button
          type="button"
          class="user-auth__google-btn"
          data-user-auth-sign-in
          role="menuitem"
          aria-label="Sign in with Google to save data across devices"
        >
          <span class="user-auth__google-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            </svg>
          </span>
          <span class="user-auth__google-label">Sign in with Google</span>
        </button>
        <p class="user-auth__sign-in-note">to save data across devices</p>
      </div>
      <button type="button" class="user-auth__action" data-user-auth-sign-out role="menuitem" hidden>
        Sign out
      </button>
    </div>
  </div>
</li>
{%- endif -%}
