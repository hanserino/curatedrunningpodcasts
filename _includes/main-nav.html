{%- assign about_href = '/about/' | relative_url -%}
{%- assign latest_href = '/latest-episodes/' | relative_url -%}
{%- assign runners_picks_href = '/runners-picks/' | relative_url -%}
<div class="header__nav-shell" data-header-actions>
  <button
    type="button"
    class="header__menu-toggle"
    aria-expanded="false"
    aria-controls="site-main-nav-panel"
    aria-label="Open menu"
  >
    <span class="header__menu-bars" aria-hidden="true"></span>
  </button>
  <div class="header__nav-panel" id="site-main-nav-panel">
    <nav class="main-nav" aria-label="Main">
      <ul class="main-nav__list">
        <li>
            <a
              href="{{ latest_href }}"
              class="main-nav__link"
              {%- if page.path == 'latest-episodes.md' or page.layout == 'latest' %} aria-current="page"{% endif %}
              >Latest episodes</a>
          </li>
        <li>
          <a
            href="{{ runners_picks_href }}"
            class="main-nav__link"
            {%- if page.layout == 'runners-picks-index' %} aria-current="page"{% endif %}
            >Runners' picks</a>
        </li>
        <li>
            <a
              href="{{ about_href }}"
              class="main-nav__link"
              {%- if page.path == 'about.md' or page.layout == 'about' %} aria-current="page"{% endif %}
              >About</a>
          </li>
        {% include user-auth.html %}
      </ul>
    </nav>
  </div>
</div>
