<div
  id="brp-global-player"
  class="brp-global-player"
  data-turbo-permanent
  hidden
  aria-live="polite"
  aria-label="Now playing"
>
  <div class="brp-global-player__inner">
    <button
      type="button"
      class="brp-global-player__now-playing"
      data-global-player-fullscreen-trigger
      aria-label="Open full player"
    >
      <div
        class="brp-global-player__art-wrap brp-global-player__art-wrap--empty"
        data-global-player-art-wrap
      >
        <img class="brp-global-player__art" data-global-player-art alt="" width="52" height="52" decoding="async">
      </div>

      <div class="brp-global-player__meta">
        <p class="brp-global-player__title" data-global-player-title></p>
        <p class="brp-global-player__show" data-global-player-show></p>
      </div>
    </button>

    <div class="brp-global-player__transport">
      <button
        type="button"
        class="brp-global-player__skip"
        data-global-player-skip-back
        aria-label="Skip back 15 seconds"
      >
        <span class="brp-global-player__skip-glyph" aria-hidden="true">15</span>
      </button>
      <button
        type="button"
        class="brp-global-player__play"
        data-global-player-play
        aria-pressed="false"
        aria-label="Play"
      >
        <span class="brp-global-player__play-glyph" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="brp-global-player__skip"
        data-global-player-skip-forward
        aria-label="Skip forward 30 seconds"
      >
        <span class="brp-global-player__skip-glyph" aria-hidden="true">30</span>
      </button>
    </div>

    <div class="brp-global-player__aux">
      <button
        type="button"
        class="brp-global-player__icon-btn brp-global-player__icon-btn--fullscreen"
        data-global-player-fullscreen
        aria-label="Open full player"
      >
        <svg class="brp-global-player__icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <path d="M7 14H5v5h5v-2H7v-3Zm-2-4h2V7h3V5H5v5Zm12 7h-3v2h5v-5h-2v3ZM14 5v2h3v3h2V5h-5Z"></path>
        </svg>
      </button>
    </div>

    <div class="brp-global-player__timeline">
      <span class="brp-global-player__time" data-global-player-current aria-hidden="true">0:00</span>
      <label class="brp-global-player__scrub-wrap">
        <input
          type="range"
          class="brp-global-player__scrub-input"
          data-global-player-scrub
          min="0"
          max="1000"
          value="0"
          step="1"
          aria-label="Seek playback position"
        >
        <span class="brp-global-player__scrub-track" aria-hidden="true"></span>
        <span class="brp-global-player__scrub-progress" data-global-player-scrub-progress style="width: 0%">
          <span class="brp-global-player__scrub-fill"></span>
        </span>
      </label>
      <span class="brp-global-player__time" data-global-player-duration aria-hidden="true">0:00</span>
    </div>
  </div>
  <audio
    id="brp-global-audio"
    preload="none"
    playsinline
    webkit-playsinline
    x-webkit-airplay="allow"
    class="brp-global-player__audio"
  ></audio>
</div>

<div
  id="brp-player-fullscreen"
  class="brp-player-fullscreen"
  data-turbo-permanent
  hidden
  aria-hidden="true"
>
  <div class="brp-player-fullscreen__panel" role="dialog" aria-modal="true" aria-labelledby="brp-player-fullscreen-title">
    <button
      type="button"
      class="brp-player-fullscreen__close"
      data-fullscreen-close
      aria-label="Close full player"
    >
      <svg class="brp-player-fullscreen__close-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>

    <p class="brp-player-fullscreen__hint">
      Press <kbd>Esc</kbd> to exit full player
    </p>

    <div class="brp-player-fullscreen__youtube" data-fullscreen-youtube hidden>
      <div class="brp-player-fullscreen__youtube-frame">
        <iframe
          class="brp-player-fullscreen__youtube-iframe"
          data-fullscreen-youtube-iframe
          title="YouTube video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <div class="brp-player-fullscreen__hero">
      <div class="brp-player-fullscreen__art-wrap brp-player-fullscreen__art-wrap--empty" data-fullscreen-art-wrap>
        <img class="brp-player-fullscreen__art" data-fullscreen-art alt="" width="280" height="280" decoding="async">
      </div>
      <div class="brp-player-fullscreen__copy">
        <h2 class="brp-player-fullscreen__title" id="brp-player-fullscreen-title" data-fullscreen-title></h2>
        <p class="brp-player-fullscreen__show" data-fullscreen-show></p>
        <div class="brp-player-fullscreen__links">
          <a class="brp-player-fullscreen__link" data-fullscreen-episode-link hidden>Open episode</a>
          <a class="brp-player-fullscreen__link" data-fullscreen-podcast-link hidden>Open podcast</a>
          <a
            class="brp-player-fullscreen__link"
            data-fullscreen-youtube-link
            hidden
            target="_blank"
            rel="noopener noreferrer"
          >Open on YouTube</a>
        </div>
      </div>
    </div>

    <div class="brp-player-fullscreen__timeline">
      <span class="brp-player-fullscreen__time" data-fullscreen-current aria-hidden="true">0:00</span>
      <label class="brp-player-fullscreen__scrub-wrap">
        <input
          type="range"
          class="brp-player-fullscreen__scrub-input"
          data-fullscreen-scrub
          min="0"
          max="1000"
          value="0"
          step="1"
          aria-label="Seek playback position"
        >
        <span class="brp-player-fullscreen__scrub-track" aria-hidden="true"></span>
        <span class="brp-player-fullscreen__scrub-progress" data-fullscreen-scrub-progress style="width: 0%">
          <span class="brp-player-fullscreen__scrub-fill"></span>
        </span>
      </label>
      <span class="brp-player-fullscreen__time" data-fullscreen-duration aria-hidden="true">0:00</span>
    </div>

    <div class="brp-player-fullscreen__controls">
      <div class="brp-player-fullscreen__transport">
        <button
          type="button"
          class="brp-player-fullscreen__skip"
          data-fullscreen-skip-back
          aria-label="Skip back 15 seconds"
        >
          <span class="brp-player-fullscreen__skip-glyph" aria-hidden="true">15</span>
        </button>
        <button
          type="button"
          class="brp-player-fullscreen__play"
          data-fullscreen-play
          aria-pressed="false"
          aria-label="Play"
        >
          <span class="brp-player-fullscreen__play-glyph" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brp-player-fullscreen__skip"
          data-fullscreen-skip-forward
          aria-label="Skip forward 30 seconds"
        >
          <span class="brp-player-fullscreen__skip-glyph" aria-hidden="true">30</span>
        </button>
      </div>
    </div>
  </div>
</div>
