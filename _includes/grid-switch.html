<span class="grid-switch__label" aria-hidden="true">View</span>
<button type="button" id="grid-switch" class="grid-switch" aria-label="Toggle between grid and list layout" aria-pressed="true" title="Grid and list view">
    <span class="grid-switch__box" aria-hidden="true">
        <svg class="grid-switch__icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
            <rect x="1" y="1" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="1" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="1" y="9" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/>
        </svg>
    </span>
    <span class="grid-switch__list" aria-hidden="true">
        <svg class="grid-switch__icon" viewBox="0 0 16 16" focusable="false" aria-hidden="true">
            <rect x="1" y="2" width="14" height="2.5" rx="0.5" fill="currentColor"/>
            <rect x="1" y="6.75" width="14" height="2.5" rx="0.5" fill="currentColor"/>
            <rect x="1" y="11.5" width="14" height="2.5" rx="0.5" fill="currentColor"/>
        </svg>
    </span>
</button>
