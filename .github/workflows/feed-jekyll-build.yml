# Lightweight RSS refresh: update _data, latest-episodes, and podcast landing players.
# Skips individual episode HTML (refreshed daily by scheduled-jekyll-build.yml).
name: Feed Jekyll build (RSS)

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jekyll-build-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Configure Jekyll build flags
        run: bash tools/ci-jekyll-env.sh

      - name: Feed refresh Jekyll build (no episode pages)
        env:
          JEKYLL_ENV: production
          JEKYLL_FETCH_RSS: "1"
          SKIP_EPISODE_PAGES: "1"
          EPISODE_PAGES_PER_PODCAST: "10"
          RSS_FETCH_CONCURRENCY: "10"
        run: bash tools/ci-jekyll-build.sh docs

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
          CI_FETCH_RSS: "1"
          SKIP_EPISODE_PAGES: "1"
          EPISODE_PAGES_PER_PODCAST: "10"
          RSS_FETCH_CONCURRENCY: "10"
        run: 'bash tools/ci-commit-push.sh "chore: refresh podcast feeds and latest-episodes"'
