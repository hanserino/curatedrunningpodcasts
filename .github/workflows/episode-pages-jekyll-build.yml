# Generate individual episode HTML from committed _data (no RSS fetch).
# Run after feed refresh when latest-episodes links to pages that are not built yet.
name: Episode pages Jekyll build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "_plugins/youtube_episode_matcher.rb"
      - "_plugins/latest_podcast_episodes.rb"
      - "_plugins/podcast_episode_pages.rb"
      - "_data/youtube_channel_ids.yml"
      - "tools/match-youtube-episodes.rb"
      - "tools/ci-episode-pages-build.sh"
      - "tools/ci-feed-and-episode-build.sh"
      - ".github/workflows/episode-pages-jekyll-build.yml"
  workflow_run:
    workflows:
      - "Feed Jekyll build (RSS)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: jekyll-build-episode-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Sync latest main (feed workflow may have pushed)
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Configure Jekyll build flags
        run: bash tools/ci-jekyll-env.sh

      - name: Episode pages Jekyll build (committed episode data)
        env:
          EPISODE_PAGES_PER_PODCAST: "10"
        run: bash tools/ci-episode-pages-build.sh

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
          CI_EPISODE_PAGES: "1"
        run: 'bash tools/ci-commit-push.sh "chore: generate missing episode pages"'
