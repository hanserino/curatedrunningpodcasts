# Rebuild when a new podcast post or media asset lands (Decap/Git push to main).
# Paths are narrow so bot commits that only touch docs/ or _data/ do not re-trigger.
# Uses committed episode data (no RSS fetch) so new podcasts ship in minutes, not hours.
# Feed refresh runs every 2h; full episode HTML rebuild runs daily on the scheduled workflow.
name: Push Jekyll build (RSS)

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"
      - "_runner_picks/**"
      - "media/**"
      - "_style/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "_config.yml"
      - "_data/latest_podcast_episodes.yml"
      - ".github/workflows/episode-pages-jekyll-build.yml"
      - ".github/workflows/feed-jekyll-build.yml"
      - ".github/workflows/push-jekyll-build.yml"
      - ".github/workflows/scheduled-jekyll-build.yml"
      - "tools/ci-commit-push.sh"
      - "tools/ci-feed-and-episode-build.sh"
      - "tools/ci-episode-pages-build.sh"
      - "tools/ci-jekyll-build.sh"
      - "tools/ci-jekyll-env.sh"
      - "tools/restore-episode-docs.sh"
      - "*.md"
      - "!docs/**"
  workflow_dispatch:

permissions:
  contents: write

# Decap/content pushes only rebuild directory pages; episode HTML is refreshed on the scheduled RSS workflow.
concurrency:
  group: jekyll-build-push
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Configure Jekyll build flags
        run: bash tools/ci-jekyll-env.sh

      - name: Production Jekyll build (directory only)
        env:
          JEKYLL_ENV: production
          SKIP_EPISODE_PAGES: "1"
        run: bash tools/ci-jekyll-build.sh docs

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
          SKIP_EPISODE_PAGES: "1"
        run: 'bash tools/ci-commit-push.sh "chore: rebuild docs (post push)"'
