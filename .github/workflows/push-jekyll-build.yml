# Rebuild when a new podcast post or media asset lands (Decap/Git push to main).
# Paths are narrow so bot commits that only touch docs/ or _data/ do not re-trigger.
# Uses committed episode data (no RSS fetch) so new podcasts ship in minutes, not hours.
# Scheduled workflow refreshes feeds and episode pages every 6 hours.
name: Push Jekyll build (RSS)

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"
      - "_runner_picks/**"
      - "media/**"
      - "_style/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "_config.yml"
      - ".github/workflows/push-jekyll-build.yml"
      - ".github/workflows/scheduled-jekyll-build.yml"
      - "tools/ci-commit-push.sh"
      - "*.md"
      - "!docs/**"
  workflow_dispatch:

permissions:
  contents: write

# Independent from scheduled RSS builds so Decap/content pushes are never blocked for hours.
concurrency:
  group: jekyll-build-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Production Jekyll build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination docs

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: 'bash tools/ci-commit-push.sh "chore: rebuild docs (post push)"'
