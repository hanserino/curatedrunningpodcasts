# Rebuild the site on a schedule so RSS-backed episode lists stay fresh without manual runs.
# Requires: repo Settings → Actions → General → Workflow permissions → “Read and write”.
name: Scheduled Jekyll build (RSS)

on:
  schedule:
    # Every 6 hours — RSS rebuild often exceeds 1h; hourly runs queued forever and were cancelled.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Separate group from push builds: a new scheduled run replaces a stuck previous one
# instead of queuing indefinitely behind a zombie in-progress run.
concurrency:
  group: jekyll-build-scheduled
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Use Node 24 for JS-based actions (checkout, etc.); avoids Node 20 deprecation on runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Configure Jekyll build flags
        run: bash tools/ci-jekyll-env.sh

      - name: Production Jekyll build (running podcasts RSS only)
        env:
          JEKYLL_ENV: production
          JEKYLL_FETCH_RSS: "1"
        run: bundle exec jekyll build --destination docs

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
          CI_FETCH_RSS: "1"
        run: 'bash tools/ci-commit-push.sh "chore: refresh RSS, optimize new media, rebuild docs"'
