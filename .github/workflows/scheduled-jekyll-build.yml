# Full RSS rebuild with individual episode HTML. Feed-only updates run every 2h via feed-jekyll-build.yml.
name: Scheduled Jekyll build (RSS)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Separate group from push builds: a new scheduled run replaces a stuck previous one
# instead of queuing indefinitely behind a zombie in-progress run.
concurrency:
  group: jekyll-build-scheduled
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Use Node 24 for JS-based actions (checkout, etc.); avoids Node 20 deprecation on runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          # depth 2 so ci-jekyll-env can diff HEAD~1; full history is not needed for RSS builds.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Optimize media (new/changed covers only)
        run: npm ci && npm run optimize-media

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.3.24"
          bundler-cache: true

      - name: Configure Jekyll build flags
        run: bash tools/ci-jekyll-env.sh

      - name: Feed refresh + episode pages
        env:
          EPISODE_PAGES_PER_PODCAST: "10"
          EPISODE_PAGES_MAX_NEW: "120"
          RSS_FETCH_CONCURRENCY: "10"
        run: bash tools/ci-feed-and-episode-build.sh

      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
          CI_FETCH_RSS: "1"
          SKIP_EPISODE_PAGES: "1"
          EPISODE_PAGES_PER_PODCAST: "10"
          RSS_FETCH_CONCURRENCY: "10"
        run: 'bash tools/ci-commit-push.sh "chore: refresh RSS, optimize new media, rebuild docs"'
