# Deploy the pre-built docs/ tree from CI (Jekyll 4 + custom plugins).
#
# Recommended GitHub Pages setting (simplest):
#   Settings → Pages → Build and deployment → Deploy from a branch
#   Branch: main, Folder: /docs
#   (docs/.nojekyll skips legacy Jekyll re-processing)
#
# Alternative: set Source to "GitHub Actions" and run this workflow.
# Do NOT click "Configure" on GitHub's suggested Jekyll workflow.
#
# This workflow runs after CI Jekyll builds only (not on every docs/ push) so
# Pages deployments do not race with GitHub's built-in pages deployment.
name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Push Jekyll build (RSS)"
      - "Scheduled Jekyll build (RSS)"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify site output exists
        run: test -f docs/index.html

      - name: Ensure static hosting markers
        run: |
          test -f docs/.nojekyll || cp .nojekyll docs/.nojekyll
          test -f docs/CNAME || cp CNAME docs/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
