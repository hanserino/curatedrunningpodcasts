<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" translate="no" class="notranslate">
<head>
	{% include head.html %}
	{% include schema-page.html %}
</head>
<body class="post-page post-page--about" data-box-grid="true">
	{% include skip-link.html %}
	<main id="main-content">
		<article class="post-about">
			<header class="post-page__intro post-page__intro--compact">
				{% include post-page-nav.html %}
				<h1 class="post-page__about-title">{{ page.title }}</h1>
			</header>
			<div class="post-article__content">
				{{- content | replace: '<img ', '<img fetchpriority="high" decoding="async" ' -}}
			</div>
			<footer class="post-article__footer">
				<p class="post-article__back"><a href="{{ '/' | relative_url }}" rel="home">← Back to the podcast directory</a></p>
			</footer>
		</article>
	</main>
	{% include footer.html %}
</body>
</html>
